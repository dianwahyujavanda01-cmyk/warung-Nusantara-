<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Nusantara V25</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Hilangkan kilatan/highlight biru bawaan browser Android saat tombol disentuh */
*, *::before, *::after {
  -webkit-tap-highlight-color: transparent !important;
}
button, a, input, textarea, select, [role="button"] {
  -webkit-tap-highlight-color: transparent !important;
  tap-highlight-color: transparent !important;
}

:root{--primary:#ed321c;--accent:#ffb900;--accent-text:#29180c;--primary-glow:rgba(237,50,28,.25);--hero-start:color-mix(in srgb,var(--primary) 55%,#35100b);--hero-mid:color-mix(in srgb,var(--primary) 35%,#1b100e);--bg:#17110f;--card:#241d19;--text:#fff7ed;--muted:#bdb0a5;--border:#40342d;--field-bg:var(--card);--board-bg:color-mix(in srgb,var(--primary) 12%,var(--card));--board-border:var(--primary);--board-highlight:var(--accent);--palette-bg:#17110f;--palette-card:#241d19;--palette-text:#fff7ed;--palette-muted:#bdb0a5;--palette-border:#40342d;--palette-light-bg:#fff8ed;--palette-light-card:#fff;--palette-light-text:#281a13;--palette-light-muted:#75675e;--palette-light-border:#e4d6c9}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Poppins,sans-serif;background-image:linear-gradient(color-mix(in srgb,var(--bg) 78%,transparent),color-mix(in srgb,var(--bg) 78%,transparent)),url("gambar-01.jpg"),radial-gradient(ellipse at 8% 4%,color-mix(in srgb,var(--primary) 12%,transparent),transparent 34%),radial-gradient(ellipse at 92% 22%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 30%);background-color:var(--bg);background-size:auto,430px auto,auto,auto;background-repeat:repeat,repeat, no-repeat,no-repeat;background-position:center top;background-attachment:fixed,fixed,fixed,fixed;color:var(--text);overflow-x:hidden;transition:background-color .3s,color .3s}body.light{background-image:linear-gradient(color-mix(in srgb,var(--bg) 95%,transparent),color-mix(in srgb,var(--bg) 95%,transparent)),url("gambar-02.jpg"),radial-gradient(ellipse at 8% 4%,color-mix(in srgb,var(--primary) 7%,transparent),transparent 34%),radial-gradient(ellipse at 92% 22%,color-mix(in srgb,var(--accent) 5%,transparent),transparent 30%);background-color:var(--bg);background-size:auto,430px auto,auto,auto;background-repeat:repeat,repeat,no-repeat,no-repeat;background-position:center top;background-attachment:fixed,fixed,fixed,fixed}
body.light{--bg:var(--palette-light-bg);--card:var(--palette-light-card);--text:var(--palette-light-text);--muted:var(--palette-light-muted);--border:var(--palette-light-border);--field-bg:var(--palette-light-card);--board-bg:color-mix(in srgb,var(--primary) 7%,var(--palette-light-card));--board-border:color-mix(in srgb,var(--primary) 75%,var(--palette-light-muted))}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4%;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(15px);border-bottom:1px solid var(--border)}
/* Transisi warna tema agar perubahan terang/gelap dan aksen terasa halus */
header,.circle,.cart-button,.btn,.hero,.featured,.category,.menu-card,.step,footer,.modal-content,.close,.form-group input,.form-group textarea,.delivery-options button,.total-box,.cart-row,.order-board,.order-board-title,.add-btn,.tag,.toast,.logo,.price,.section-title{transition:background-color .38s ease,color .38s ease,border-color .38s ease,box-shadow .38s ease,background .38s ease}
.logo,.section-title,.menu-card h3,.step h3,.setting-option h4,.modal-header h2,.price,.step strong{transition:color .32s ease}
.logo{font-family:"Playfair Display",serif;color:var(--accent);font-size:27px;line-height:1.1;font-weight:800}
.header-actions{display:flex;align-items:center;gap:10px}
.circle{width:49px;height:49px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:21px}
.cart-button,.btn{background:var(--primary);color:white;border:0;border-radius:50px;padding:13px 23px;font-size:15px;font-weight:700;box-shadow:0 5px 25px var(--primary-glow);transition:.25s}
.cart-button:hover,.btn:hover{transform:scale(1.05)}
.category,.add-btn,.delivery-options button,.qty button,.circle,.close{transition:background-color .38s ease,color .38s ease,border-color .38s ease,box-shadow .38s ease,transform .2s ease}
.cart-button span{display:inline-flex;align-items:center;justify-content:center;background:white;color:var(--primary);border-radius:50%;width:29px;height:29px;margin-left:5px}
.hero{min-height:600px;padding:90px 20px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,var(--hero-start) 0%,var(--hero-mid) 58%,var(--bg) 100%)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(2px)}
.hero::before{width:330px;height:330px;left:-145px;top:8%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 15%,transparent),transparent 70%);animation:heroAura 8s ease-in-out infinite}
.hero::after{width:390px;height:390px;right:-180px;bottom:-8%;background:radial-gradient(circle,color-mix(in srgb,var(--primary) 22%,transparent),transparent 70%);animation:heroAura 10s ease-in-out infinite reverse}
.hero-content{max-width:750px;position:relative;z-index:3}
.hero-kicker{display:inline-flex;align-items:center;gap:9px;margin-bottom:22px;padding:8px 15px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:30px;background:color-mix(in srgb,var(--bg) 28%,transparent);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:2px}
.hero-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.hero-details{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:24px auto 0;color:#f4e7d9;font-size:11px;letter-spacing:.3px}
.hero-details span{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:30px;background:color-mix(in srgb,var(--bg) 35%,transparent);border:1px solid color-mix(in srgb,#fff 14%,transparent)}
.hero-details b{color:var(--accent);font-size:13px}
.hero-float{position:absolute;z-index:1;display:grid;place-items:center;width:76px;height:76px;border-radius:24px;background:linear-gradient(145deg,#ffffff1c,#ffffff08);border:1px solid #ffffff20;box-shadow:0 15px 40px #00000022;backdrop-filter:blur(5px);font-size:38px;animation:heroDrift 6s ease-in-out infinite;pointer-events:none}
.hero-float.one{left:9%;top:19%;transform:rotate(-12deg)}.hero-float.two{right:10%;top:20%;width:66px;height:66px;font-size:32px;border-radius:50%;animation-delay:-2s}.hero-float.three{left:15%;bottom:15%;width:58px;height:58px;font-size:28px;border-radius:50%;animation-delay:-4s}.hero-float.four{right:13%;bottom:13%;width:82px;height:82px;font-size:40px;border-radius:26px;animation-delay:-1s}
@keyframes heroDrift{0%,100%{translate:0 0;rotate:-4deg}50%{translate:0 -16px;rotate:5deg}}
@keyframes heroAura{0%,100%{transform:scale(.94);opacity:.6}50%{transform:scale(1.08);opacity:1}}
.hero h1{font-family:"Playfair Display",serif;font-size:clamp(42px,8vw,76px);color:var(--accent);line-height:1.1}
.hero h1 span{display:block;color:white}
.hero p{color:#f0dcd1;font-size:17px;line-height:1.9;margin:28px 0}
.hero .btn{font-size:18px;padding:17px 45px}
.pepper{position:absolute;font-size:60px;opacity:.12;animation:float 4s ease-in-out infinite}
.pepper.one{left:10%;top:25%}.pepper.two{right:10%;bottom:20%;animation-delay:1s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-25px) rotate(10deg)}}
section{padding:76px 4%;scroll-margin-top:80px}
.section-title{font-family:"Playfair Display",serif;font-size:clamp(32px,5vw,50px);margin-bottom:18px;line-height:1.15}
.section-desc{color:var(--muted);line-height:1.8;margin-bottom:28px;max-width:760px}
.featured{position:relative;padding:68px 5%;background:transparent;color:var(--text);overflow:hidden}
.featured-inner{max-width:1180px;margin:0 auto}
.featured-heading{text-align:center;max-width:760px;margin:0 auto 32px}
.featured-heading .section-title{margin-bottom:12px}
.featured-heading .section-desc{margin:0 auto;max-width:650px}
.featured-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}
.featured-item{min-width:0;padding:12px 12px 18px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 8px 24px #00000012;transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease}
.featured-item:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--primary) 55%,var(--border));box-shadow:0 14px 30px #00000020}
.featured-item img{display:block;width:100%;height:220px;object-fit:cover;border-radius:16px;transition:transform .55s ease}
.featured-item:hover img{transform:scale(1.025)}
.featured-item h3{font-family:"Playfair Display",serif;margin:16px 8px 7px;font-size:21px;color:var(--text)}
.featured-item p{margin:0 8px;color:var(--muted);font-size:13px;line-height:1.65}
.featured-item:nth-child(2){transition-delay:.08s}.featured-item:nth-child(3){transition-delay:.16s}
.no-anim .featured-item,.no-anim .featured-item img{transition:none!important}.no-anim .featured-item:hover{transform:none}.no-anim .featured-item:hover img{transform:none}
.menu-section{max-width:1250px;margin:auto}
.categories{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.category{padding:12px 22px;border-radius:40px;background:var(--card);color:var(--text);border:1px solid var(--border);font-weight:600}
.category.active{background:var(--primary);color:white;border-color:var(--primary)}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:stretch}
.menu-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:17px;text-align:center;overflow:hidden;transition:transform .3s,box-shadow .3s;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;-webkit-tap-highlight-color:transparent;tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.menu-card:hover{transform:translateY(-8px);box-shadow:0 15px 35px #0004}
.menu-card.is-floating{position:relative;z-index:3;border-color:var(--primary);animation:menuCardEmphasis .75s cubic-bezier(.2,.85,.25,1);box-shadow:0 0 0 1px var(--primary),0 10px 24px var(--primary-glow)}
.menu-card.is-floating::after{content:"";position:absolute;inset:3px;border:1px solid var(--primary);border-radius:25px;pointer-events:none;opacity:0;animation:menuCardStroke .75s ease-out}
@keyframes menuCardEmphasis{0%{transform:translateY(0) scale(1)}28%{transform:translateY(-16px) scale(1.055)}52%{transform:translateY(-10px) scale(1.035)}75%{transform:translateY(-13px) scale(1.045)}100%{transform:translateY(-9px) scale(1.015)}}
@keyframes menuCardStroke{0%{opacity:0;inset:8px}30%{opacity:.45;inset:3px}65%{opacity:.25;inset:3px}100%{opacity:0;inset:3px}}
.menu-card .food-image{transition:transform .45s ease}
.menu-card.is-floating .food-image{transform:scale(1.035)}
.no-anim .menu-card.is-floating{transform:none;box-shadow:none;animation:none;border-color:var(--border)}
.no-anim .menu-card.is-floating::after{display:none;animation:none}
.food-image{width:100%;height:220px;object-fit:cover;border-radius:20px;cursor:pointer;background:#332924;transition:transform .4s}
.menu-card.is-floating .food-image{transform:scale(1.035)}
.menu-card:active{cursor:grabbing}
.no-anim .menu-card.is-floating .food-image{transform:none}
.menu-card h3{font-family:"Playfair Display",serif;font-size:23px;margin:20px 0 5px}
.menu-card p{color:var(--muted);font-size:13px;min-height:40px;line-height:1.55}
.price{color:var(--primary);font-weight:800;font-size:21px;margin:14px 0}
.tag{position:absolute;top:25px;left:25px;background:var(--accent);color:var(--accent-text);padding:6px 13px;border-radius:30px;font-size:12px;font-weight:700;z-index:2}
.add-btn{padding:12px 30px;background:var(--primary);color:white;border:0;border-radius:40px;font-weight:700;font-size:15px;transition:.2s;margin-top:auto;align-self:center}
.add-btn:active{transform:scale(.85)}
.instructions{max-width:900px;margin:auto}.steps{display:grid;gap:20px}
.step{background:var(--card);border-radius:28px;padding:30px;border-left:8px solid var(--primary)}
.step strong{display:block;font-family:"Playfair Display",serif;font-size:48px;color:var(--primary)}
.step h3{margin:8px 0}.step p{color:var(--muted);line-height:1.8}
footer{border-top:1px solid var(--border);text-align:center;padding:55px 15px;color:var(--muted);line-height:2}
.reveal{opacity:0;transform:translateY(35px);transition:opacity .7s ease,transform .7s ease}
.reveal.show{opacity:1;transform:translateY(0)}.no-anim .reveal{opacity:1;transform:none;transition:none}.no-anim .pepper,.no-anim .loader-food{animation:none}
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:15px;background:#000a;backdrop-filter:blur(8px)}
.modal.show{display:flex;animation:fade .25s}
.modal.closing{display:flex;animation:fadeOut .18s ease forwards;pointer-events:none}
.modal-content{background:var(--card);color:var(--text);border-radius:28px;padding:25px;width:100%;max-width:570px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;animation:pop .35s;border:1px solid var(--border)}
body.modal-locked{overflow:hidden!important;overscroll-behavior:none;touch-action:none}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}@keyframes popOut{from{transform:scale(1);opacity:1}to{transform:scale(.96);opacity:0}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close{width:42px;height:42px;border-radius:50%;background:transparent;color:var(--text);border:1px solid var(--border);font-size:24px}
.form-group{margin:15px 0}.form-group label{display:block;margin-bottom:8px;font-weight:600}
.form-group input,.form-group textarea{width:100%;padding:14px;border-radius:15px;border:1px solid var(--border);background:var(--field-bg);color:var(--text);font-family:inherit;font-size:14px}
.form-group textarea{resize:none;height:104px;min-height:104px;max-height:104px;overflow-y:auto;overscroll-behavior:contain;display:block}.form-group #customerNote{height:88px;min-height:88px;max-height:88px}
/* Compact single-line checkout fields */
.form-group input.compact-field{display:block;box-sizing:border-box;height:50px;min-height:50px;max-height:50px;padding:0 15px;line-height:normal;white-space:nowrap;overflow:hidden;text-overflow:clip;resize:none;-webkit-appearance:none;appearance:none}
.delivery-options{display:flex;gap:10px}.delivery-options button{flex:1;padding:13px;border-radius:13px;background:var(--bg);color:var(--text);border:1px solid var(--border);font-weight:600}
.delivery-options button.active{background:var(--primary);color:white;border-color:var(--primary)}
.wa-loading-hint{margin:10px 0 0;text-align:center;color:var(--muted);font-size:13px}
#sendWhatsAppBtn:disabled{opacity:.82;cursor:wait;filter:saturate(.8)}
#sendWhatsAppBtn .wa-loading-row{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.wa-spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:waSpin .7s linear infinite;flex:0 0 auto}
@keyframes waSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.wa-spinner{animation-duration:1.8s}}
.total-box{background:var(--bg);padding:18px;border-radius:18px;margin:18px 0;border:1px solid var(--border)}
.total-row{display:flex;justify-content:space-between;margin:8px 0}.total-row.final{font-size:20px;font-weight:800;color:var(--accent)}
.order-board{background:var(--board-bg);color:var(--text);border:4px solid var(--board-border);border-radius:16px;padding:18px;margin:18px 0;box-shadow:inset 0 0 15px #0006;font-family:monospace;font-size:13px;line-height:1.6}
.order-board-title{text-align:center;font-weight:700;font-size:15px;color:var(--accent);border-bottom:1px dashed var(--border);padding-bottom:8px;margin-bottom:10px;letter-spacing:1px}
.order-board pre{white-space:pre-wrap;font-family:inherit;color:var(--text)}
.cart-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:30px;height:30px;border:0;background:var(--primary);color:white;border-radius:50%;font-weight:700}
.setting-option{margin:22px 0}.setting-option h4{margin-bottom:12px}.theme-colors{display:flex;gap:13px}
.color-dot{width:48px;height:48px;border:3px solid transparent;border-radius:50%}.color-dot.selected{outline:3px solid var(--text);outline-offset:3px}
#foodLoader{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;transition:opacity .5s}
.loader-food{font-size:70px;animation:bounceSpin 1.2s ease-in-out infinite}
@keyframes bounceSpin{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(180deg)}}
#foodLoader p{color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.5px}
.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,100px);background:var(--primary);color:white;padding:14px 25px;border-radius:40px;z-index:500;transition:.4s;font-weight:600;box-shadow:0 10px 25px #0006}
.toast.show{transform:translate(-50%,0)}@media(max-width:800px){.menu-grid{grid-template-columns:repeat(2,1fr)}.featured-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:500px){.logo{font-size:21px}header{padding:12px 4%}.circle{width:42px;height:42px}.cart-button{padding:10px 12px;font-size:12px}.menu-grid{grid-template-columns:1fr}.food-image{height:240px}section{padding:65px 5%}.hero{min-height:530px}.featured{padding:52px 5%}.featured-grid{grid-template-columns:1fr;gap:18px}.featured-item img{height:230px}.featured-heading{margin-bottom:24px}}

/* V18 — editorial showcase: a varied composition, not repeated product cards */
.featured{position:relative;overflow:hidden;padding:clamp(64px,8vw,112px) 5%;background:var(--bg);}
.showcase-wrap{max-width:1180px;margin:0 auto;}
.showcase-top{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:end;margin-bottom:42px;}
.showcase-kicker,.showcase-tag{display:inline-block;color:var(--accent);font:700 10px/1.4 Poppins,sans-serif;letter-spacing:2px;}
.showcase-title{font:800 clamp(34px,5.2vw,64px)/1.04 'Playfair Display',serif;color:var(--text);margin:13px 0 0;letter-spacing:-1.5px;}
.showcase-title em{color:var(--primary);font-style:normal;}
.showcase-intro{max-width:390px;color:var(--muted);font:400 14px/1.9 Poppins,sans-serif;margin:0 0 5px auto;}
.showcase-layout{display:grid;grid-template-columns:1.12fr .88fr;gap:22px;align-items:stretch;}
.showcase-main,.showcase-mini{min-width:0;overflow:hidden;border-radius:24px;background:var(--card);border:1px solid var(--border);}
.showcase-main{display:flex;flex-direction:column;}
.showcase-photo,.showcase-mini-photo{position:relative;overflow:hidden;background:var(--field-bg);}
.showcase-photo{height:clamp(280px,38vw,470px);}
.showcase-photo img,.showcase-mini-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease;}
</style>
</head>
<body>
